<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Nix Manager's navigation without whitespace inside its buttons</title>
<style>ul, [role="list"] { list-style: none; padding: 0 } button { display: flex; gap: 0.75rem; width: 100% }</style></head>
<body>
<nav aria-label="Sections"><ul role="list">
  <li><button aria-current="page"><svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16"><rect width="24" height="24"/></svg><span>Overview</span><!----></button></li>
  <li><button><svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16"><rect width="24" height="24"/></svg><span>Changes</span><span>2</span><!----></button></li>
</ul></nav>
</body>
</html>
